# Feurs Chambeon. QFU 331 preferred due to environmental protection
# (VAC TXT 01), so 33 comes first.
[LFLZ.choice.1]
note = "Published preferred QFU"
runways = ["33"]

[LFLZ.choice.2]
runways = ["15"]

# Fayence. Aeroplanes use 10R/28L, into wind; no preference is published.
# 14/32 is one-way (32 only) and reserved for gliders, and 10L/28R is
# reserved for gliders from sunrise to sunset (VAC TXT 01); both are left
# out. Landings are difficult in a strong north-westerly (mistral)
# (VAC TXT 01).
[LFMF.choice.1]
note = "Aeroplane runway"
runways = ["10R/28L"]

# Istres Le Tube. Both ends have instrument approaches (ILS 15, RNP Z 15 and
# 33: AD 2.19, AD 2.24).
#
# Noise (AD 2.21.1): take-offs are made on 33 by priority when the tailwind
# is 10 kt or less, in low-activity periods: 18:00 to 08:00 local on working
# days, and all day at weekends and on public holidays. Only the time window
# can be expressed. With a tailwind on 33 up to 5 kt all traffic uses 33;
# above that, landings turn to 15 and take-offs stay on 33 up to 10 kt.
#
# LVP starts at RVR below 1600 m or ceiling below 300 ft (AD 2.22); both
# ends are certified for it, so no runway changes. Visibility stands in for
# the RVR when the METAR gives none.
[LFMI]
lvo = "rvr < 1600 or visibility < 1600 or ceiling < 300"

[LFMI.choice.10]
name = "LOW ACTIVITY 33"
note = "Noise priority to 33, low-activity periods"
runways = ["33"]
when = "time 18:00-08:00"
established_tailwind_hours = 0

[LFMI.choice.20]
name = "LOW ACTIVITY DEP 33"
note = "Take-offs 33 up to 10 kt tailwind, landings 15"
arr = ["15"]
