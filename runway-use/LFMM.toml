# Gap Tallard. QFU 203 preferred; take-off on 203 is preferred with a
# north-sector wind below 5 m/s (VAC TXT 01). Below about 9 kt of tailwind,
# departures stay on 20 while landings face into the wind on 02. Service
# aircraft landing 02 during glider/parachute activity cannot be expressed.
# The adjoining unpaved runway and glider strip are not in our database.
[LFNA.choice.1]
note = "Published preferred QFU"
runways = ["20"]

[LFNA.choice.2]
note = "Take-off 20 preferred with north wind below 5 m/s"
arr = ["02"]
dep = ["20"]
max_tailwind = 9
established_tailwind_hours = 0

[LFNA.choice.3]
runways = ["02"]

# Mende Brenoux. Only 12 has an instrument approach (RNP: AD 2.24).
# North winds give strong down draughts on final 30 (AD 2.23, VAC TXT 01).
[LFNB]
instrument_approaches = ["12"]

[LFNB.choice.1]
note = "Only runway with an instrument approach"
runways = ["12"]

[LFNB.choice.2]
runways = ["30"]

# Vinon. QFU 280 preferred in winds below 2 m/s; RWY 10 only when the wind
# allows no other QFU (VAC TXT 01). Otherwise the longest runway, 02/20,
# faces into the wind, with 28 and 16/34 as crosswind fallbacks. During
# intense towing the runway in use is the glider take-off one: not
# expressible. RWY 30 is reserved for glider landings and not in our
# database.
[LFNF.choice.10]
note = "Published preferred QFU in light wind"
runways = ["28"]
when = "wind < 4"
established_tailwind_hours = 0

[LFNF.choice.20]
runways = ["02/20"]

[LFNF.choice.30]
runways = ["28"]

[LFNF.choice.40]
runways = ["16/34"]

[LFNF.choice.50]
note = "RWY 10 only when no other QFU is usable"
runways = ["10"]

# Montpellier Candillargues. QFU 142 preferred due to environment
# (VAC TXT 01).
[LFNG.choice.1]
note = "Published preferred QFU"
runways = ["14"]

[LFNG.choice.2]
runways = ["32"]

# Carpentras. QFU 310 preferred due to environment (VAC TXT 01). The
# unpaved parallel runway is not in our database; simultaneous use of both
# runways is prohibited.
[LFNH.choice.1]
note = "Published preferred QFU"
runways = ["31"]

[LFNH.choice.2]
runways = ["13"]

# Berre la Fare. Restricted use, reserved for based aircraft. QFU 338
# preferred due to prevailing winds, lighting conditions and high terrain
# (VAC TXT 01). Both grass runways are open to the same users, so 08/26 is
# kept as the crosswind fallback. Low circuits and engine failure exercises
# are prohibited on 08/26, which only concerns training.
[LFNR.choice.1]
note = "Published preferred QFU"
runways = ["34"]

[LFNR.choice.2]
runways = ["16"]

[LFNR.choice.3]
note = "Crosswind runway"
runways = ["08/26"]

# Bedarieux La Tour-sur-Orb. With a southerly wind of 5 kt or less, QFU 352
# is preferred (VAC TXT 01), so 35 deliberately takes that tailwind.
[LFNX.choice.1]
note = "Published preferred QFU, southerly wind up to 5 kt"
runways = ["35"]
established_tailwind_hours = 0

[LFNX.choice.2]
runways = ["17"]

# La Grand'Combe. QFU 346 preferred due to heavy down-draughts with a
# northerly wind (VAC TXT 01).
[LFTN.choice.1]
note = "Published preferred QFU"
runways = ["35"]

[LFTN.choice.2]
runways = ["17"]

# Puimoisson. Glider site reserved for based aircraft. 07/25 is prohibited
# with a northerly wind above 20 kt (VAC TXT 01); north is taken as 315-045.
# 16/34 is usable only by based aircraft under local instructions, which
# matches the users of the whole aerodrome, so it is kept as the fallback.
# Powered aircraft may land on 07 with a westerly wind below 15 kt because of
# the slope; that is a per-aircraft allowance and is left out.
[LFTP.choice.1]
runways = ["07/25"]

[LFTP.choice.2]
note = "07/25 prohibited or crosswind"
runways = ["16/34"]

[[LFTP.unavailable]]
runways = ["07/25"]
when = "wind from 315-045 and wind > 20"
note = "Northerly wind above 20 kt"

# La Mole. Landing QFU 240 preferred due to terrain, take-off QFU 060
# preferred (AD 2.20.5, VAC TXT 03). The only IAC is a VOR-A to 24, a
# circling procedure, so arrivals are not confined to 24. The aerodrome is
# unusable above 15 kt mean wind from 040-070 MAG and above 13 kt mean or
# 16 kt maximum from any other direction (AD 2.20.5); that closes its only
# runway, so it is not written as a rule. AFIS hours, contaminated runway and
# aircraft approvals are not modelled.
[LFTZ.choice.1]
note = "Published preferred QFUs: landing 24, take-off 06"
arr = ["24"]
dep = ["06"]
established_tailwind_hours = 0

[LFTZ.choice.2]
runways = ["06/24"]
