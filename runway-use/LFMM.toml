[LFLJ.choice.1]
note = "One-way altiport: landings 22, take-offs 04"
arr = ["22"]
dep = ["04"]
established_tailwind_hours = 0

# Macon Charnay. QFU 352 preferred due to the longer LDA (VAC TXT 01), so
# 35 comes first.
[LFLM.choice.1]
note = "Published preferred QFU"
runways = ["35"]

[LFLM.choice.2]
runways = ["17"]

# Montelimar Ancone. QFU 019 preferred due to the environment (VAC TXT 01),
# so 02 comes first. The ULM grass strip may not be used at the same time
# as the aircraft runway (VAC TXT 01).
[LFLQ.choice.1]
note = "Published preferred QFU"
runways = ["02"]

[LFLQ.choice.2]
runways = ["20"]

# Saint-Rambert-d'Albon. Two parallel grass runways of the same length that
