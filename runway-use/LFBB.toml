#:schema ../schemas/runway-use.schema.json
# Bordeaux FIR.
#
# Choices are read by number: 1 is the first choice, and the first usable one
# is used. See the README for every setting and the condition language.

[defaults]
timezone = "Europe/Paris"
max_tailwind = 5          # kt, gusts included
max_crosswind = 20        # kt, gusts included

# 05/23 is used into wind until the crosswind on it goes above 15 kt;
# 11/29 then takes over.

[LFBD.choice.1]
note = "Main runway, into wind"
runways = ["05/23"]
max_crosswind = 15

[LFBD.choice.2]
note = "Crosswind runway"
runways = ["11/29"]

[[LFBD.unavailable]]
runways = ["11/29"]
when = "lvo"
note = "No LVP on 11/29"

# ---------------------------------------------------------------------------
# Toulouse approach area (LFBO_*_APP), from the eAIP of 03 SEP 2026 (AIRAC
# 2609). Section numbers refer to each airport's AD 2 page, except LFCL, which
# only has a VAC.
# ---------------------------------------------------------------------------

# Toulouse Blagnac. Landings use 14R/32L only and departures use both runways.
# The AIP states this split for the night (AD 2.21.4.1.3); the vACC applies it
# by day too.
#
# Preferred direction (AD 2.21.4.1.3): with an axial wind below 5 kt, 14 is
# preferred from 2200 to 0600 local and 32 is "re-established before 0600",
# so 32 is preferred by day. At night in 14, departures also use 14R only.
#
# Low visibility:
# - LVP starts at RVR 550 m or ceiling 200 ft, at or below (AD 2.20.3.4,
#   AD 2.22.1.4). Only 14R is used, for landings and departures
#   (AD 2.22.1.3). Visibility stands in for the RVR when the METAR gives none.
# - Pre-LVP, RVR 550 to 800 m when CAT III operations are expected (taken
#   here as always): only the 14 runways are used (AD 2.22.1.3, AD 2.22.1.4).
# - LVP only ends once the RVR is above 800 m (AD 2.22.1.4); the conditions
#   here cannot hold it on, so between 550 and 800 m on the way out the
#   pre-LVP configuration is used instead.
#
# Wind:
# - Crosswind above 15 kt: turbulence on short final 32L may move every
#   movement to 32R (AD 2.21.4.1.3).
# - Tailwind limit 5 kt gusts included (AD 2.21.4.1.3), as in [defaults].
#
# Counter-QFU (landing one way, departing the other) is not used: it is
# forbidden from SR-30 to SS+30 (AD 2.23.5).
[LFBO]
lvo = "rvr <= 550 or visibility <= 550 or ceiling <= 200"

[LFBO.choice.10]
name = "LVP"
note = "CAT III on 14R only"
runways = ["14R"]
when = "lvo"

[LFBO.choice.20]
name = "NIGHT 14"
note = "Night noise preference, 14R for landings and departures"
runways = ["14R"]
when = "time 22:00-06:00 and (wind < 5 or headwind 32L < 5)"
established_tailwind_hours = 0

[LFBO.choice.30]
name = "NIGHT 32"
arr = ["32L"]
dep = ["32R", "32L"]
when = "time 22:00-06:00"

[LFBO.choice.40]
name = "PRE-LVP"
note = "Only the 14 runways are used before LVP"
arr = ["14R"]
dep = ["14L", "14R"]
when = "rvr <= 800 or visibility <= 800"

[LFBO.choice.50]
name = "32"
arr = ["32L"]
dep = ["32R", "32L"]
max_crosswind = 15

[LFBO.choice.60]
name = "32R ONLY"
note = "Crosswind above 15 kt, turbulence on short final 32L"
runways = ["32R"]

[LFBO.choice.70]
name = "14"
arr = ["14R"]
dep = ["14L", "14R"]

# When one runway is closed, the other one is used alone, into wind.

[LFBO.choice.80]
name = "14R/32L ONLY"
runways = ["14R/32L"]

[LFBO.choice.90]
name = "14L/32R ONLY"
runways = ["14L/32R"]

# Agen. Only 29 has instrument procedures (RNP approach, SID, STAR: AD 2.24),
# so arrivals stay on it whatever the wind and an easterly is worked with a
# visual approach or circling. 29 is also the first choice, so both directions
# use it while the tailwind stays within the limit. The LVO limits (AD 2.22.6)
# restrict landings and take-offs but change no runway.
[LFBA]
instrument_approaches = ["29"]

[LFBA.choice.1]
runways = ["29"]

[LFBA.choice.2]
note = "Departures only; arrivals stay on 29"
runways = ["11"]

# Carcassonne. Both directions have an RNP approach and SIDs (AD 2.24) and no
# preference is published, so the runway faces into the wind. 09/27 is limited
# to 25 kt of crosswind on a dry runway, 20 kt on a wet one (AD 2.20.1.2); the
# dry value is used. The grass runway 09L/27R is for based single-engine
# aircraft only.
[LFMK.choice.1]
runways = ["09/27"]
max_crosswind = 25

# Muret, 13 NM south-west of Blagnac, faces the same way as LFBO: 12 with 14,
# 30 with 32. This is a vACC rule; the AIP does not state it. Only 12 has
# instrument approaches (NDB and RNP: AD 2.24); arrivals to 30 circle
# (AD 2.22.3). The unpaved runways are not used: they close after heavy rain
# and only one aircraft runway may be used at a time (AD 2.20.3, AD 2.22).
[LFBR]
follow = "LFBO"

[LFBR.choice.1]
runways = ["12/30"]

# Toulouse Francazal, 5 NM south of Blagnac, faces the same way as LFBO: 11
# with 14, 29 with 32. This is a vACC rule; the AIP does not state it.
[LFBF]
follow = "LFBO"

[LFBF.choice.1]
runways = ["11/29"]

# Castres. Only 14 has instrument procedures (RNP approaches, SID, STAR); 32
# only has a visual manoeuvre with prescribed track (AD 2.24).
[LFCK.choice.1]
note = "Only runway with instrument procedures"
runways = ["14"]

[LFCK.choice.2]
runways = ["32"]

# Toulouse Lasbordes, 6 NM east of Blagnac, faces the same way as LFBO: 15
# with 14, 33 with 32. This is a vACC rule; the AIP does not state it. It
# agrees with the VAC's preference for 33 (AD 2 LFCL TXT 01), since 32 is
# LFBO's day configuration and Lasbordes is not approved for night VFR.
[LFCL]
follow = "LFBO"

[LFCL.choice.1]
runways = ["15/33"]

# Albi. Both directions have an RNP approach (AD 2.24) and no preference is
# published: into wind.
[LFCI.choice.1]
runways = ["09/27"]

# Pamiers. Only 09 has instrument approaches (NDB and RNP: AD 2.24).
[LFDJ.choice.1]
note = "Only runway with instrument approaches"
runways = ["09"]

[LFDJ.choice.2]
runways = ["27"]


# ---------------------------------------------------------------------------
# Other airports, from the eAIP of 29 OCT 2026 (AIRAC 2611): AD 2 pages and
# VACs. Airports not listed here have nothing in their AIP that changes the
# default, their longest runway facing into the wind.
# ---------------------------------------------------------------------------

# Cognac Châteaubernard (military). Civil aircraft are limited to 15 kt of
# crosswind on 05/23 (AD 2.20.2, VAC TXT 01); military aircraft to 20 kt on
# a wet runway and 25 kt on a dry one (AD 2.20.4). The civil value is used.
# 08/26 is paved and approved for night VFR without restriction (VAC TXT
# 04), and is the crosswind runway. Only 05/23 has instrument approaches
# (RNP, VOR, ILS 23: AD 2.24), so IFR arrivals stay on it. No preferred
# direction is published.
[LFBG]
instrument_approaches = ["05", "23"]

[LFBG.choice.1]
note = "Main runway, into wind"
runways = ["05/23"]
max_crosswind = 15

[LFBG.choice.2]
note = "Crosswind runway"
runways = ["08/26"]

# Poitiers Biard. QFU 209° (21) is preferred because of the IFR procedures
# (VAC TXT 01). Both directions have an RNP approach (AD 2.24). The grass
# runways are for light aircraft only, 03L/21R for based aircraft, and they
# cannot be used at the same time as the paved runway (AD 2.20.5); they are
# not offered.
[LFBI.choice.1]
note = "Preferred direction"
runways = ["21"]

[LFBI.choice.2]
runways = ["03"]

# Montluçon Guéret. Only 17 has an instrument approach (RNP: AD 2.24). The
# grass runway is reserved for gliders, tugs, based tailwheel aircraft and
# aerobatics, and is often unusable in heavy rain (VAC TXT 01); it is not
# offered.
[LFBK]
instrument_approaches = ["17"]

[LFBK.choice.1]
note = "Only runway with an instrument approach"
runways = ["17"]

[LFBK.choice.2]
runways = ["35"]

# Limoges Bellegarde. LVP starts at RVR 550 m or ceiling 200 ft, at or below
# (AD 2.22.3.2). Only 21 is approved for CAT III, and in LVP arrivals land on
# 21 and departures use 21 (AD 2.22.3.1.1, 2.22.3.1.3). Otherwise 03/21
# faces into the wind: both directions have an RNP approach (AD 2.24) and no
# preference is published. The grass runway is reserved for based gliders
# and tugs (AD 2.20.3.1) and is not offered.
[LFBL]
lvo = "rvr <= 550 or visibility <= 550 or ceiling <= 200"

[LFBL.choice.10]
name = "LVP"
note = "CAT III on 21 only"
runways = ["21"]
when = "lvo"

[LFBL.choice.20]
runways = ["03/21"]

# Mont-de-Marsan (military, closed to public air traffic: AD 2.20.1). Only
# 27 has an instrument approach (ILS and LOC: AD 2.19, AD 2.24).
[LFBM]
instrument_approaches = ["27"]

[LFBM.choice.1]
note = "Only runway with an instrument approach"
runways = ["27"]

[LFBM.choice.2]
runways = ["09"]

# Niort Marais Poitevin. QFU 246° (25) is preferred because threshold 07
# cannot be seen from the holding point (AD 2.20.1.2, VAC TXT 01). It is
# also the only end with an instrument approach (RNP); 07 only has a visual
# manoeuvre with prescribed track (AD 2.24). The 682 m grass runway runs
# alongside and gives no crosswind option; it is not offered.
[LFBN]
instrument_approaches = ["25"]

[LFBN.choice.1]
note = "Preferred direction, only runway with an instrument approach"
runways = ["25"]

[LFBN.choice.2]
runways = ["07"]

# Pau Pyrénées. Only 31 has instrument approaches (ILS, RNP, NDB); 13 only
# has a visual manoeuvre with prescribed track (AD 2.24). LVP starts at RVR
# 550 m or ceiling 200 ft, the default (AD 2.22.5.2). Only 31 is certified
# for CAT II/III and low-visibility take-offs (AD 2.22.5.1), so 13 is not
# used in LVP.
[LFBP]
instrument_approaches = ["31"]

[LFBP.choice.1]
note = "Only runway with instrument approaches"
runways = ["31"]

[LFBP.choice.2]
runways = ["13"]

[[LFBP.unavailable]]
runways = ["13"]
when = "lvo"
note = "LVP on 31 only"

# Biscarrosse Parentis. The paved runway 09/27 is the main one; only 27 has
# instrument approaches (RNP, NDB: AD 2.24). The longer grass runway
# 09R/27L runs alongside and is not offered; 13/31 is reserved for based
# aircraft (AD 2.20.1, VAC TXT 01). Runways cannot be used at the same time
# (VAC TXT 01).
[LFBS]
instrument_approaches = ["27"]

[LFBS.choice.1]
note = "Only runway with instrument approaches"
runways = ["27"]

[LFBS.choice.2]
runways = ["09"]

# Tarbes Lourdes Pyrénées. Only 20 has instrument approaches (ILS, RNP,
# NDB); 02 only has a visual manoeuvre with prescribed track (AD 2.24). LVP
# starts at RVR 800 m or ceiling 200 ft (AD 2.22.8.1). At night, VFR
# landings on 02 and most VFR take-offs from 20 are prohibited (VAC TXT
# 01); this only concerns VFR and night is set by sunset, so it is not
# written here.
[LFBT]
instrument_approaches = ["20"]
lvo = "rvr < 800 or visibility < 800 or ceiling < 200"

[LFBT.choice.1]
note = "Only runway with instrument approaches"
runways = ["20"]

[LFBT.choice.2]
runways = ["02"]

# Angouleme Brie Champniers. QFU 276 is preferred because of the IFR
# procedure (VAC TXT 01). Only 28 has instrument approaches (ILS/LOC and
# RNP: AD 2.24), so arrivals stay on it whatever the wind.
[LFBU]
instrument_approaches = ["28"]

[LFBU.choice.1]
note = "Published preferred QFU; only end with instrument approaches"
runways = ["28"]

[LFBU.choice.2]
note = "Departures only; arrivals stay on 28"
runways = ["10"]

# Perigueux Bassillac. QFU 112 is preferred because of noise (VAC TXT 01).
# Only 29 has an instrument approach (RNP: AD 2.24), so IFR arrivals stay on
# 29 and land against the preferred direction. The unpaved 11L/29R is for
# based aircraft and authorised glider pilots only, the two runways may not
# be used at the same time (AD 2.23.2), and it is unusable during and after
# heavy rain (AD 2.7).
[LFBX]
instrument_approaches = ["29"]

[LFBX.choice.1]
note = "Published preferred QFU; IFR arrivals stay on 29"
runways = ["11"]

[LFBX.choice.2]
runways = ["29"]

# Dax Seyresse, a military VFR aerodrome. The preferred axis is QFU 25
# (AD 2.20, VAC TXT 03).
[LFBY.choice.1]
note = "Published preferred QFU"
runways = ["25"]

[LFBY.choice.2]
runways = ["07"]

# Biarritz Pays Basque. Both ends have instrument approaches (AD 2.24).
#
# Preferred direction:
# - QFU 268 is preferred because of the ILS procedure (VAC TXT 01).
# - From 2000 to 0700 (21:00 to 08:00 local), 09 is preferred for take-off
#   "whenever conditions allow" (AD 2.21.2). Arrivals keep the ILS on 27.
#
# Low visibility: LVP starts when the RVR is below 800 m or the ceiling below
# 200 ft (AD 2.22.5); visibility stands in for the RVR when the METAR gives
# none. Only 27 is certified for CAT I precision approaches (AD 2.22.5), so
# it is used alone in LVP.
#
# The 25 kt limit for a southerly crosswind applies to a wet runway only
# (AD 2.20.3.4); the default limit is lower.
[LFBZ]
lvo = "rvr < 800 or visibility < 800 or ceiling < 200"

[LFBZ.choice.10]
name = "LVP"
note = "CAT I approach on 27 only"
runways = ["27"]
when = "lvo"

[LFBZ.choice.20]
name = "NIGHT"
note = "Night preference for take-off 09"
arr = ["27"]
dep = ["09"]
when = "time 21:00-08:00"
established_tailwind_hours = 0

[LFBZ.choice.30]
note = "Published preferred QFU"
runways = ["27"]

[LFBZ.choice.40]
runways = ["09"]

# Chatellerault Targe. QFU 176 is preferred because of noise and the
# obstacles in the QFU 356 take-off funnel (VAC TXT 01). The ULM strip is for
# pendulum ULM, autogyros and based multi-axis ULM only.
[LFCA.choice.1]
note = "Published preferred QFU"
runways = ["18"]

[LFCA.choice.2]
runways = ["36"]

# Andernos-les-Bains. QFU 128 is preferred because of the houses west of the
# aerodrome (VAC TXT 01).
[LFCD.choice.1]
note = "Published preferred QFU"
runways = ["13"]

[LFCD.choice.2]
runways = ["31"]

# Figeac Livernon. QFU 108 is preferred because of the surroundings and the
# longer landing distance (VAC TXT 01).
[LFCF.choice.1]
note = "Published preferred QFU"
runways = ["11"]

[LFCF.choice.2]
runways = ["29"]

# Saint-Girons Antichan. QFU 332 is preferred because of the terrain and the
# runway slope (VAC TXT 01). The grass strip beside the paved runway is for
# based aircraft and gliders only.
[LFCG.choice.1]
note = "Published preferred QFU"
runways = ["33"]

[LFCG.choice.2]
runways = ["15"]

# Arcachon La Teste de Buch. The paved 07/25 is the main runway; the unpaved
# 07R/25L beside it is only a fallback when 07/25 is closed, since the two
# may not be used at the same time (VAC TXT 01). QFU 252 is preferred
# because of the golf residences east of the aerodrome (VAC TXT 01).
[LFCH.choice.1]
note = "Published preferred QFU"
runways = ["25"]

[LFCH.choice.2]
runways = ["07"]

[LFCH.choice.3]
note = "Unpaved runway, when 07/25 is closed"
runways = ["07R/25L"]

# Jonzac Neulles. QFU 316 is preferred because of noise (VAC TXT 01).
[LFCJ.choice.1]
note = "Published preferred QFU"
runways = ["32"]

[LFCJ.choice.2]
runways = ["14"]

# Nogaro. QFU 135° is preferred because it gives the longest landing
# distance (VAC TXT 01). The VAC also has an unpaved 14R/32L and an
# acceleration strip, both reserved for gliders and based aircraft, and the
# two runways may not be used at the same time (VAC TXT 01).
[LFCN.choice.1]
note = "Published preferred QFU"
runways = ["14"]

[LFCN.choice.2]
runways = ["32"]

# Oloron-Herrère. QFU 249° is preferred because of the runway slope (VAC TXT
# 01). The VAC calls this runway 07L/25R; its parallel 07R/25L is reserved
# for based gliders and the two may not be used at the same time.
[LFCO.choice.1]
note = "Published preferred QFU"
runways = ["25"]

[LFCO.choice.2]
runways = ["07"]

# Graulhet-Montdragon. QFU 094° is preferred because of the surroundings (VAC
# TXT 02). The paved 09/27 is used; the unpaved 09L/27R is reserved for
# gliders, based users and registered visitors, and both runways may not be
# used at the same time (VAC TXT 01). A strong south-easterly brings
# turbulence on QFU 094° (VAC TXT 01).
[LFCQ.choice.1]
note = "Published preferred QFU"
runways = ["09"]

[LFCQ.choice.2]
runways = ["27"]

# Bordeaux Léognan-Saucats. QFU 211° is preferred because of the
