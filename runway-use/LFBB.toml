# and it is not in our database (VAC TXT 01).
[LFDA.choice.1]
note = "Preferred QFU, longer LDA"
runways = ["12"]

[LFDA.choice.2]
runways = ["30"]

# Montauban. QFU 134° (13) is preferred because of the environment
# (VAC TXT 01).
[LFDB.choice.1]
note = "Preferred QFU, environment"
runways = ["13"]

[LFDB.choice.2]
runways = ["31"]

# Montendre Marcillac. QFU 152° (15) is preferred because of the environment
# (VAC TXT 01).
[LFDC.choice.1]
note = "Preferred QFU, environment"
runways = ["15"]

[LFDC.choice.2]
runways = ["33"]

# Egletons. The grass runway 07R/25L is reserved for based aircraft and both
