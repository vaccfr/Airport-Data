# the same time (AD 2.20.1.3). On a wet runway, 10 is limited with a
# 20 kt wind from 180° (AD 2.20.1.3); wet runways cannot be tested here.
[LFCY]
instrument_approaches = ["28"]

[LFCY.choice.1]
note = "Published preferred QFU, only end with an instrument approach"
runways = ["28"]

[LFCY.choice.2]
note = "Departures only; arrivals stay on 28"
runways = ["10"]

# Aire-sur-l'Adour. QFU 115° (12) is preferred because of its longer LDA
# (VAC TXT 01). The unpaved runway beside it is reserved for gliders and for
