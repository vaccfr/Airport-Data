[LFCX.choice.1]
note = "Published preferred QFU"
runways = ["10"]

[LFCX.choice.2]
runways = ["28"]

# Royan-Médis. QFU 280° is preferred because of the IFR procedure and noise
# (VAC TXT 01), and 28 has the only instrument approach (RNP: AD 2.24), so
