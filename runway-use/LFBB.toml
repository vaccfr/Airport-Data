[LFDF.choice.1]
note = "Preferred QFU, nearby controlled airspace"
runways = ["27"]

[LFDF.choice.2]
runways = ["09"]

# Gaillac Lisle-sur-Tarn. QFU 251° (25) is preferred because of the
