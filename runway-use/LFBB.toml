# aircraft.
[LFCS.choice.1]
note = "Published preferred QFU"
runways = ["21"]

[LFCS.choice.2]
runways = ["03"]

# Thouars. QFU 298° is preferred because of the longitudinal slope (VAC TXT
# 01).
[LFCT.choice.1]
note = "Published preferred QFU"
runways = ["30"]

[LFCT.choice.2]
runways = ["12"]

# Villefranche-de-Rouergue. QFU 309° is preferred because of noise and the
# upslope of the runway (VAC TXT 01). A strong southerly or south-easterly
# brings turbulence on QFU 129° (VAC TXT 01).
[LFCV.choice.1]
note = "Published preferred QFU"
runways = ["31"]

[LFCV.choice.2]
runways = ["13"]

# Villeneuve-sur-Lot. QFU 282° is preferred because of the surroundings (VAC
# TXT 01).
[LFCW.choice.1]
note = "Published preferred QFU"
runways = ["28"]

[LFCW.choice.2]
runways = ["10"]

# Castelsarrasin-Moissac. QFU 100° is preferred for both runways (VAC TXT
