#:schema ../schemas/runway-use.schema.json
# Paris FIR.
#
# Choices are read by number: 1 is the first choice, and the first usable one
# is used. See the README for every setting and the condition language.
#
# Sources: the eAIP of 01 OCT 2026 (AIRAC 2610) and SUP AIP 085/26 and 192/26.
# Section numbers refer to each airport's AD 2 page; airports without one are
# described by their VAC.

[defaults]
timezone = "Europe/Paris"
max_tailwind = 5          # kt, gusts included
max_crosswind = 20        # kt, gusts included

# ---------------------------------------------------------------------------
# Roissy approach
# ---------------------------------------------------------------------------

# Paris-Charles de Gaulle. The outer runways (08R/26L, 09L/27R) take the
# arrivals and the inner ones (08L/26R, 09R/27L) the departures
# (AD 2.20.3.2.1). From 0000 to 0500 local every take-off and landing is
# westward while the tailwind is 1 kt or less (AD 2.22.4.1). No preferred
# direction is published by day; west comes first, as at night. LVP starts at
# RVR 600 m or cloud base 200 ft (AD 2.22.8) and changes no runway: every end
# has a CAT III ILS (AD 2.19).
#
# When a runway is closed, the other runway of its pair takes its traffic.
[LFPG]
lvo = "rvr <= 600 or visibility <= 600 or ceiling < 200"

[LFPG.choice.10]
name = "NIGHT WEST"
arr = ["26L", "27R"]
dep = ["26R", "27L"]
when = "time 00:00-05:00"
max_tailwind = 1
established_tailwind_hours = 0

[LFPG.choice.20]
name = "WEST"
arr = ["26L", "27R"]
dep = ["26R", "27L"]

[LFPG.choice.21]
name = "WEST, 26R MIXED"
arr = ["26R", "27R"]
dep = ["26R", "27L"]

[LFPG.choice.22]
name = "WEST, 26L MIXED"
arr = ["26L", "27R"]
dep = ["26L", "27L"]

[LFPG.choice.23]
name = "WEST, 27L MIXED"
arr = ["26L", "27L"]
dep = ["26R", "27L"]

[LFPG.choice.24]
name = "WEST, 27R MIXED"
arr = ["26L", "27R"]
dep = ["26R", "27R"]

[LFPG.choice.30]
name = "EAST"
arr = ["08R", "09L"]
dep = ["08L", "09R"]

[LFPG.choice.31]
name = "EAST, 08L MIXED"
arr = ["08L", "09L"]
dep = ["08L", "09R"]

[LFPG.choice.32]
name = "EAST, 08R MIXED"
arr = ["08R", "09L"]
dep = ["08R", "09R"]

[LFPG.choice.33]
name = "EAST, 09R MIXED"
arr = ["08R", "09R"]
dep = ["08L", "09R"]

[LFPG.choice.34]
name = "EAST, 09L MIXED"
arr = ["08R", "09L"]
dep = ["08L", "09L"]

# Paris-Le Bourget faces the same way as Roissy. 27 is for landings only and
# 09 for take-offs only (AD 2.13, AD 2.22.1.1): west lands on 27 and departs
# from 25, east lands on 07 and departs from 09 (AD 2.22.2.2.2, 2.22.3.2.3).
# Jets departing from 2115 to 0500 UTC (2215 to 0600 local) use 07 if possible
# (AD 2.21.2.1). 21 is used only exceptionally and 03 has no instrument
# procedure, so neither is offered.
[LFPB]
follow = "LFPG"

[LFPB.choice.10]
name = "EAST NIGHT"
note = "Night jet departures on 07"
runways = ["07"]
when = "time 22:15-06:00"

[LFPB.choice.20]
name = "WEST"
arr = ["27"]
dep = ["25"]

[LFPB.choice.30]
name = "EAST"
arr = ["07"]
dep = ["09"]

[LFPB.choice.40]
name = "WEST, 25 ONLY"
note = "When 27 is unavailable"
runways = ["25"]

[LFPB.choice.50]
name = "EAST, 07 ONLY"
note = "When 09 is unavailable"
runways = ["07"]

# Pontoise. Only 04/22 has instrument approaches (RNP, AD 2.24), so arrivals
# stay on it; 12/30 is the crosswind runway. No preferred direction is
# published.
[LFPT]
instrument_approaches = ["04", "22"]

[LFPT.choice.1]
runways = ["04/22"]

[LFPT.choice.2]
runways = ["12/30"]

# ---------------------------------------------------------------------------
# Orly approach
# ---------------------------------------------------------------------------

# Paris-Orly. West departs from 24 and lands on 25, east departs from 07 and
# lands on 06 (AD 2.21.2.1). 02/20 is only a complement when a main runway is
# unavailable (AD 2.21.2.1): with 06/24 closed, west lands on 25 and departs
# from 20 (SUP AIP 085/26) and east lands on 02 and departs from 07. 02 is
# CAT I only and closed to IFR take-offs (AD 2.13, AD 2.19).
#
# The vACC sets Orly's direction from the wind and from Roissy's:
#
#   wind 0-4 kt                       as LFPG
#   wind 5-11 kt from 000-135         east
#                from 136-180         as LFPG
#                from 181-315         west
#                from 316-360         as LFPG
#   wind 12 kt or more from 341-159   east
#                      from 160-340   west
#
# `follow` carries the "as LFPG" rows. Each choice is limited to the winds in
# which its direction is allowed: following Roissy, or the table's own sector
# for that direction. While Orly follows, both directions are allowed and
# Roissy's decides; otherwise only one is.
#
# Not used: the AIP's night rule, where from 2330 to 0600 take-offs go west and
# landings east (AD 2.21.2.2), since the table never leaves Orly facing two
# ways; and 02/20 in strong north or south winds, for which no threshold is
# published.
[LFPO]
follow = { icao = "LFPG", when = "wind < 5 or (wind < 12 and (wind from 136-180 or wind from 316-360))" }
lvo = "rvr <= 600 or visibility <= 600 or ceiling <= 200"

[LFPO.choice.10]
name = "WEST"
arr = ["25"]
dep = ["24"]
when = "wind < 5 or (wind < 12 and wind from 136-360) or wind from 160-340"

[LFPO.choice.11]
name = "WEST 25/20"
note = "06/24 unavailable: crossing runways"
arr = ["25"]
dep = ["20"]
when = "wind < 5 or (wind < 12 and wind from 136-360) or wind from 160-340"

[LFPO.choice.12]
name = "WEST, 25 ONLY"
note = "06/24 unavailable and 20 unusable"
runways = ["25"]
when = "wind < 5 or (wind < 12 and wind from 136-360) or wind from 160-340"

[LFPO.choice.13]
name = "WEST, 24 ONLY"
note = "07/25 unavailable"
runways = ["24"]
when = "wind < 5 or (wind < 12 and wind from 136-360) or wind from 160-340"

[LFPO.choice.20]
name = "EAST"
arr = ["06"]
dep = ["07"]
when = "wind < 5 or (wind < 12 and wind from 316-180) or wind from 341-159"

[LFPO.choice.21]
name = "EAST 02/07"
note = "06/24 unavailable: 02 complements 07"
arr = ["02"]
dep = ["07"]
when = "wind < 5 or (wind < 12 and wind from 316-180) or wind from 341-159"

[LFPO.choice.22]
name = "EAST, 07 ONLY"
note = "06/24 unavailable and 02 unusable (LVP or wind)"
runways = ["07"]
when = "wind < 5 or (wind < 12 and wind from 316-180) or wind from 341-159"

[LFPO.choice.23]
name = "EAST, 06 ONLY"
note = "07/25 unavailable"
runways = ["06"]
when = "wind < 5 or (wind < 12 and wind from 316-180) or wind from 341-159"

[LFPO.choice.90]
name = "NO WIND DIRECTION"
note = "Variable or unreported wind of 5 kt or more"
runways = ["07/25"]

[[LFPO.unavailable]]
runways = ["06/24"]
from = 2026-08-09T22:00:00Z
to = 2026-12-17T23:00:00Z
note = "Works, SUP AIP 085/26 and 192/26. SUP 192/26 allows phases by NOTAM until 10 JUN 2027"

[[LFPO.unavailable]]
runways = ["02"]
when = "lvo"
note = "CAT I only"

# Paris-Saclay Versailles (Toussus) faces the same way as Orly. 07L/25R is the
# instrument runway and the only one usable in LVP (AD 2.22.3.10); 07R/25L has
# no instrument procedure and is offered only when 07L/25R is unavailable.
[LFPN]
metar = ["LFPN", "LFPV"]
follow = "LFPO"

[LFPN.choice.1]
runways = ["07L/25R"]

[LFPN.choice.2]
runways = ["07R/25L"]

[[LFPN.unavailable]]
runways = ["07R/25L"]
when = "lvo"
note = "LVP on 07L/25R only"

# Villacoublay faces the same way as Orly.
[LFPV]
follow = "LFPO"

[LFPV.choice.1]
runways = ["09/27"]

# Saint-Cyr-l'École. QFU 292° is preferred, landings on 11L/29R and take-offs
# from 11R/29L, and before 0800 UTC in winter (0700 in summer) 29R is used
# for both (VAC TXT 04). The VAC gives these under the instructions for when
# the tower is closed; they are kept for every hour.
[LFPZ.choice.10]
name = "29R ONLY"
runways = ["29R"]
when = "time 00:00-09:00"

[LFPZ.choice.20]
name = "29"
arr = ["29R"]
dep = ["29L"]

[LFPZ.choice.30]
name = "11"
arr = ["11L"]
dep = ["11R"]

# Lognes-Emerainville. QFU 080° is preferred for its better clearances (VAC
# TXT 03, under the instructions for when the tower is closed; kept for every
# hour). The paved runway 08/26 is used; the VAC gives no rule for the unpaved
# 08R/26L.
[LFPL.choice.1]
runways = ["08"]

[LFPL.choice.2]
runways = ["26"]

# ---------------------------------------------------------------------------
# Beauvais approach
# ---------------------------------------------------------------------------

# Beauvais-Tillé. 12/30 faces into the wind; no preferred direction is
# published. In LVP only 12 can be used: its ILS is CAT III, 30's is CAT I.
# LVP starts at RVR 550 m or ceiling 200 ft, the default (AD 2.22.2). 04/22 is a 708 m light-aircraft strip, closed at night and below
# 1500 m visibility (AD 2.20), and is not offered.
[LFOB.choice.10]
name = "LVP"
runways = ["12"]
when = "lvo"

[LFOB.choice.20]
runways = ["12/30"]


# ---------------------------------------------------------------------------
# Other airports, from the eAIP of 29 OCT 2026 (AIRAC 2611): AD 2 pages and
# VACs. Airports not listed here have nothing in their AIP that changes the
# default, their longest runway facing into the wind.
# ---------------------------------------------------------------------------

# Calais-Dunkerque. QFU 239° is preferred because of the IFR procedure (VAC
# TXT 01), and 24 is the only end with an instrument approach (RNP, AD 2.24),
# so arrivals stay on 24 whatever the wind and an easterly is worked with a
# visual approach or circling.
[LFAC]
instrument_approaches = ["24"]

[LFAC.choice.1]
note = "Preferred, only end with an instrument approach"
runways = ["24"]

[LFAC.choice.2]
note = "Departures only; arrivals stay on 24"
runways = ["06"]

# Compiègne-Margny. QFU 226° is preferred because of the departmental road
# D935, which also reduces the TODA of 05 (VAC TXT 01).
[LFAD.choice.1]
runways = ["23"]

[LFAD.choice.2]
runways = ["05"]

# Nangis-les-Loges. QFU 052° is preferred to limit noise (VAC TXT 01). The
# paved runway 05/23 is used; the parallel unpaved 05L/23R may not be used at
# the same time (VAC TXT 01) and is not offered.
[LFAI.choice.1]
runways = ["05"]

[LFAI.choice.2]
runways = ["23"]

# La Flèche-Thorée-les-Pins. QFU 082° is preferred because of the environment
# (VAC TXT 01). The aerodrome is reserved for based aircraft and those of the
# neighbouring aerodromes.
[LFAL.choice.1]
runways = ["08"]

[LFAL.choice.2]
runways = ["26"]

# Rethel-Perthes. QFU 235° is preferred because of power lines and noise
# (VAC TXT 01). The VAC names the runway 06/24 (QFU 055°/235°); the database
# calls it 05/23, so the preferred end is 23 here. The aerodrome is reserved
# for based aircraft and those of the neighbouring aerodromes.
[LFAP.choice.1]
runways = ["23"]

[LFAP.choice.2]
runways = ["05"]

# Albert-Bray. QFU 264° is preferred because of the IFR procedure (VAC TXT
# 01); both ends of the paved 08/26 have RNP approaches (AD 2.24), so no end
# is restricted. The grass runway 08R/26L (AD 2.12) is only offered when
# 08/26 is unavailable: it is not cleared of snow (AD 2.7) and gliders are
# parked near it (AD 2.23.1).
[LFAQ.choice.1]
note = "Preferred direction"
runways = ["26"]

[LFAQ.choice.2]
runways = ["08"]

[LFAQ.choice.3]
note = "Grass runway, when 08/26 is unavailable"
runways = ["08R/26L"]

# Le Touquet-Elizabeth II. Runway 13 is preferred because of the IFR
# procedure (VAC TXT 01); both ends have instrument approaches (ILS/LOC and
# RNP to 13, RNP to 31: AD 2.24). 13/31 is limited to 25 kt of crosswind on a
# dry runway, 20 kt on a wet one (AD 2.22.1); the dry value is used.
[LFAT]
max_crosswind = 25

[LFAT.choice.1]
note = "Preferred direction"
runways = ["13"]

[LFAT.choice.2]
runways = ["31"]

# Valenciennes-Denain. QFU 110° is preferred because of the IFR procedures
# (VAC TXT 01); both ends of the paved 11/29 have RNP approaches (AD 2.24).
# 11/29 is the preferred runway, except for ULM (VAC TXT 01). The unpaved
# 11L/29R is usable by aeroplanes but not at the same time as the paved one
# (VAC TXT 01), so it is only a fallback when 11/29 is unavailable. The
# unpaved 06/24 is the crosswind runway.
[LFAV.choice.1]
note = "Preferred direction"
runways = ["11"]

[LFAV.choice.2]
runways = ["29"]

[LFAV.choice.3]
note = "Unpaved, when the paved runway is unavailable"
runways = ["11L/29R"]

[LFAV.choice.4]
note = "Crosswind runway"
runways = ["06/24"]

# Villerupt. QFU 065° is preferred because of the runway slope (VAC TXT 01).
# The aerodrome is reserved for based aircraft and ULM and those of the
# neighbouring aerodromes.
[LFAW.choice.1]
runways = ["07"]

[LFAW.choice.2]
runways = ["25"]

# Montargis-Vimory. QFU 225° is preferred for environmental reasons (VAC
# TXT 01), so the paved runway 04R/22L is used with 22L first. The unpaved
# 04L/22R, on a field with winch and tow glider activity, is not offered;
# the VAC gives no rule for it.
[LFEM.choice.1]
note = "Published preferred QFU"
runways = ["22L"]

[LFEM.choice.2]
runways = ["04R"]

# Saulieu-Liernais. QFU 234° is preferred for landing because of the runway
# slope (VAC TXT 01); it is applied to every movement. 05/23 may not be used
# with a crosswind above 15 kt because of trees beside the runway (VAC TXT
# 01).
[LFEW]
max_crosswind = 15

[LFEW.choice.1]
note = "Published preferred QFU for landing"
runways = ["23"]

[LFEW.choice.2]
runways = ["05"]

# Buno-Bonnevaux. The aerodrome is reserved for gliders and service aircraft,
# and the runway in use follows the gliding and ULM activity (VAC TXT 01),
# which cannot be expressed here. QFU 277° is preferred to avoid the Essonne
# valley (VAC TXT 01), so 28 comes first on 10/28. 01/19 is the crosswind
# runway; the VAC places no restriction on it.
[LFFB.choice.1]
note = "Published preferred QFU"
runways = ["28"]

[LFFB.choice.2]
runways = ["10"]

[LFFB.choice.3]
note = "Crosswind runway"
runways = ["01/19"]

# Saint-André-de-l'Eure. QFU 231° is preferred for environmental reasons
# (VAC TXT 01), so 23R comes first on the main runway 05L/23R. The 400 m
# strip 05R/23L is not offered.
[LFFD.choice.1]
note = "Published preferred QFU"
runways = ["23R"]

[LFFD.choice.2]
runways = ["05L"]

# Château-Thierry-Belleau. QFU 034° is preferred for environmental reasons
# (VAC TXT 01).
[LFFH.choice.1]
note = "Published preferred QFU"
runways = ["03"]

[LFFH.choice.2]
runways = ["21"]

# Etrépagny. QFU 114° is preferred because of the environment (VAC TXT 01).
# The aerodrome is reserved for based aircraft and those based on the
# neighbouring aerodromes listed on the VAC.
[LFFY.choice.1]
note = "Published preferred QFU"
runways = ["11"]

[LFFY.choice.2]
runways = ["29"]

# Auxerre-Branches. QFU 184° is preferred for landing because of the IFR
# procedure (VAC TXT 01); it is applied to both directions of the single
# runway. Both ends have an RNP approach (AD 2.24). 18/36 is limited to 25 kt
# of crosswind on a dry runway, 20 kt otherwise (VAC TXT 01); the dry value
# is used.
[LFLA]
max_crosswind = 25

[LFLA.choice.1]
note = "Published preferred landing QFU"
runways = ["18"]

[LFLA.choice.2]
runways = ["36"]

# Bourges. QFU 238° is preferred because of the environment (VAC TXT 01).
# Only 06 has instrument approaches (RNP Y and Z: AD 2.24), so arrivals stay
# on 06 and an approach to 24 is flown visually or by circling. The unpaved
# 06R/24L is reserved for gliders, service and based aircraft, and the two
# runways may not be used at the same time (VAC TXT 01); it is not offered.
[LFLD]
instrument_approaches = ["06"]

[LFLD.choice.1]
note = "Published preferred QFU"
runways = ["24"]

[LFLD.choice.2]
runways = ["06"]

# Alençon-Valframbert. QFU 068° is preferred for safety and take-off noise
# (VAC TXT 01). The unpaved 07L/25R is reserved for gliders and service
# aircraft and the two runways may not be used at the same time (VAC TXT 01);
# the paved 07R/25L is used.
[LFOF.choice.1]
note = "Published preferred QFU"
runways = ["07R"]

[LFOF.choice.2]
runways = ["25L"]

# Rouen-Vallée de Seine. QFU 220° is preferred because of the IFR procedures
# and the high-intensity lighting (VAC TXT 01), and with no wind landings are
# on 22 (AD 2.22.1). Both ends have instrument approaches (AD 2.24). LVP is in
# force when the RVR is 800 m or less (AD 2.22.6.2); visibility stands in for
# a missing RVR. The grass 05/23 is reserved for based aircraft (AD 2.20.1)
# and is not offered.
[LFOP]
lvo = "rvr <= 800 or visibility <= 800"

[LFOP.choice.1]
note = "Published preferred QFU"
runways = ["22"]

[LFOP.choice.2]
runways = ["04"]

# Blois-Le Breuil. 12/30 has priority (AD 2.20) and QFU 300° is preferred
# (VAC TXT 01). Both ends have an RNP approach (AD 2.24). Only one runway may
# be used at a time (AD 2.22.1). The unpaved 02R/20L is the crosswind
# fallback. 02L/20R and 12R/30L are glider runways (AD 2.12), 12L/30R
# parallels the main runway and 02/20 is only 250 m long, so they are not
# offered.
[LFOQ.choice.1]
note = "Published preferred QFU"
runways = ["30"]

[LFOQ.choice.2]
runways = ["12"]

[LFOQ.choice.3]
note = "Crosswind runway"
runways = ["02R/20L"]

# Étampes-Mondésir. QFU 056° is preferred because of the environment (VAC TXT
# 02). The two runways may not be used at the same time (VAC TXT 02). The
# paved 06/24 comes first; the longer grass 06L/24R is the fallback when it is
# unavailable.
[LFOX.choice.1]
note = "Published preferred QFU"
runways = ["06"]

[LFOX.choice.2]
runways = ["24"]

[LFOX.choice.3]
note = "Paved runway unavailable"
runways = ["06L"]

[LFOX.choice.4]
runways = ["24R"]

# Orléans-Saint-Denis-de-l'Hôtel. QFU 232° is preferred because of the IFR
# procedure (VAC TXT 01). Both ends have an RNP approach (AD 2.24). LVP is in
# force when the RVR, or failing it the visibility, is below 400 m; 05/23 is
# then approved for departures only (AD 2.22.3). The unpaved 05R/23L is
# reserved for gliders, service aircraft and aircraft authorised by the
# operator, and is unusable after heavy rain and in winter (VAC TXT 01); it is
# not offered.
[LFOZ]
lvo = "rvr < 400 or visibility < 400"

[LFOZ.choice.1]
note = "Published preferred QFU"
runways = ["23"]

[LFOZ.choice.2]
runways = ["05"]

# Melun-Villaroche. QFU 282° is preferred (VAC TXT 01). Only 28 has
# instrument approaches (RNP Y and Z: AD 2.24), so arrivals stay on 28 and
# an approach to 10 is flown visually or by circling. 01/19 is the crosswind
# runway.
[LFPM]
instrument_approaches = ["28"]

[LFPM.choice.1]
note = "Published preferred QFU"
runways = ["28"]

[LFPM.choice.2]
runways = ["10"]

[LFPM.choice.3]
note = "Crosswind runway"
runways = ["01/19"]

# Reims-Prunay. 07/25 is the paved runway (1150 m) and has an RNP approach
# at each end (AD 2.12, AD 2.24). The unpaved 07R/25L beside it is not
# offered: it faces the same way, the two may not be used together, gliders
# use it and it needs care after heavy rain (VAC TXT 01). No preferred
# direction is published.
[LFQA.choice.1]
runways = ["07/25"]

# Troyes-Barberey. QFU 172° is preferred because of the infrastructure
# (VAC TXT 01), so 17 comes first and 35 second; both have an RNP approach
# (AD 2.24). The unpaved 05/23 is the crosswind runway. It may not be used
# together with 17/35 or 17R/35L, and it is closed while an IFR procedure is
# in progress (VAC TXT 01). The unpaved 17R/35L faces the same way as 17/35
# and is not offered.
[LFQB.choice.1]
runways = ["17"]

[LFQB.choice.2]
runways = ["35"]

[LFQB.choice.3]
note = "Crosswind runway, not during IFR procedures"
runways = ["05/23"]

# Nevers-Fourchambault. QFU 301° is preferred because of the IFR procedure
# (VAC TXT 01), and only 30 has instrument approaches (NDB and RNP:
# AD 2.24), so arrivals stay on 30. The grass strip 12L/30R is reserved for
# authorised aircraft, unusable after rain, and may not be used together
# with the paved runway (AD 2.20.1, VAC TXT 01).
[LFQG]
instrument_approaches = ["30"]

[LFQG.choice.1]
runways = ["30"]

[LFQG.choice.2]
note = "Departures only; arrivals stay on 30"
runways = ["12"]

# Lille-Lesquin. 08/26 is the main runway, with instrument approaches at both
# ends (AD 2.24); 01/19 has none, so arrivals stay on 08/26 and 01/19 is
# the crosswind runway. No preferred direction is published. LVP start at
# the latest when the RVR is down to 550 m or the ceiling to 200 ft
# (AD 2.22.5.2). Only 26 has a CAT II/III ILS; 08 is certified for
# low-visibility take-offs only (AD 2.22.5.1.1), so 26 is used in LVP.
[LFQQ]
instrument_approaches = ["08", "26"]
lvo = "rvr <= 550 or visibility <= 550 or ceiling <= 200"

[LFQQ.choice.10]
name = "LVP"
note = "CAT II/III ILS on 26 only"
runways = ["26"]
when = "lvo"

[LFQQ.choice.20]
runways = ["08/26"]

[LFQQ.choice.30]
note = "Crosswind runway"
runways = ["01/19"]

# Merville-Calonne. QFU 216° is preferred because of the ILS procedure
# (VAC TXT 01), so 22 comes first; 04 also has NDB and RNP approaches
# (AD 2.24). The grass strip 04R/22L is reserved for gliders during their
# activity and may not be used together with 04/22 (AD 2.20, VAC TXT 01).
[LFQT.choice.1]
runways = ["22"]

[LFQT.choice.2]
runways = ["04"]

# Saint-Dizier-Robinson, military. 11/29 is the paved runway, with an RNP
# approach at each end (AD 2.24). The grass 11L/29R is used by the based
# gliding club and may not be used together with 11/29 (AD 2.12, AD 2.20.1).
# LVP are set up when the RVR is below 800 m (AD 2.22.5).
[LFSI]
lvo = "rvr < 800 or visibility < 800"

[LFSI.choice.1]
runways = ["11/29"]

# Romorantin-Pruniers, military, restricted use; no AD 2 page. Both runways
# are unpaved. 04R/22L is reserved for gliders, tugs and based aircraft, so
# 04L/22R is the runway for other aircraft (VAC TXT 01). No preferred
