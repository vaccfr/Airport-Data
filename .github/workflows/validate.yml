name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the datasets
        run: node tools/airport-data.mjs validate . --format github
      - name: Check the JSON Schemas
        # Runs even when the datasets fail, so every problem shows at once.
        if: ${{ !cancelled() }}
        run: node tools/airport-data.mjs schemas --check schemas
