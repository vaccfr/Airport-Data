#:schema ../schemas/positions.schema.json
# Paris FIR.
#
# Each entry lists the airports a position controls, top-down, most important
# first. Only the first four that publish an ATIS can be on at once, so the
# order is the priority. `atis = false` leaves the ATIS off a field the
# position controls. Fields somebody else controls, whose runways the position
# still needs for its arrivals, go in `runways_only`: they are active for
# arrivals only and never get an ATIS. See the README for the full format.
#
# Tower, ground, delivery and ramp are not listed: they are responsible for the
# airport their callsign names, and need no entry.
#
# Every approach below covers its own field. Where it also gives top-down
# service to neighbouring fields, add them to its list.
#
# Centre positions list the airports they cover when no approach is open
# beneath them.

[[position]]
match = ["LFOB_APP", "LFOB_*_APP"]
airports = [
  "LFOB",
]

[[position]]
match = ["LFPG_*_APP", "LFPG_*_DEP"]
airports = [
  "LFPG",
  "LFPO",
  "LFOB",
  "LFPB",
  "LFPN",
  "LFPT",
  "LFPL",
  "LFPZ",
  "LFPV",
]

[[position]]
match = ["LFPO_APP", "LFPO_DEP", "LFPO_*_APP"]
airports = [
  "LFPO",
  "LFPN",
  "LFPV",
]

[[position]]
match = ["LFQQ_*_APP"]
airports = [
  "LFQQ",
  "LFQT",
  { icao = "LFAT", atis = false },
  { icao = "LFAC", atis = false },
  { icao = "LFAV", atis = false },
  { icao = "LFAQ", atis = false },
]

[[position]]
match = ["LFPM_*_APP"]
airports = [
  "LFOK",
  "LFPM",
  { icao = "LFOT", atis = false },
  { icao = "LFQA", atis = false },
  { icao = "LFQB", atis = false },
  { icao = "LFOZ", atis = false },
  { icao = "LFOQ", atis = false },
  { icao = "LFLA", atis = false },
  { icao = "LFOJ", atis = false },
]

[[position]]
match = ["LFPT_APP", "LFPT_*_APP"]
airports = [
  "LFPT",
]

[[position]]
match = ["PAR_CTR", "PAR_LOW_CTR"]
airports = [
  "LFPG",
  "LFPO",
  "LFOB",
  "LFQQ",
  "LFPB",
  "LFPN",
  "LFOK",
  "LFPT",
  "LFPM",
  "LFPL",
  "LFQT",
  "LFPZ",
  { icao = "LFPV", atis = false },
  { icao = "LFAT", atis = false },
  { icao = "LFOT", atis = false },
  { icao = "LFAC", atis = false },
  { icao = "LFAV", atis = false },
  { icao = "LFQA", atis = false },
  { icao = "LFQB", atis = false },
  { icao = "LFOZ", atis = false },
  { icao = "LFOQ", atis = false },
  { icao = "LFAQ", atis = false },
  { icao = "LFLA", atis = false },
  { icao = "LFOJ", atis = false },
]

[[position]]
match = ["PAR_RPAE_CTR"]
airports = [
  "LFPG",
  "LFPO",
  "LFOB",
  "LFPB",
  "LFPN",
  "LFOK",
