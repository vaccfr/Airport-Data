#:schema ../schemas/positions.schema.json
# Reims FIR.
#
# Each entry lists the airports a position controls, top-down, most important
# first. Only the first four that publish an ATIS can be on at once, so the
# order is the priority. `atis = false` leaves the ATIS off a field the
# position controls. Fields somebody else controls, whose runways the position
# still needs for its arrivals, go in `runways_only`: they are active for
# arrivals only and never get an ATIS. See the README for the full format.
#
# Tower, ground, delivery and ramp are not listed: they are responsible for the
# airport their callsign names, and need no entry.
#
# Every approach below covers its own field. Where it also gives top-down
# service to neighbouring fields, add them to its list.
#
# Centre positions are not described yet. Each needs an entry naming the
# airports it covers when no approach is open beneath it.

[[position]]
match = ["LFJL_APP"]
airports = [
  "LFJL",
  { icao = "LFSG", atis = false },
  { icao = "LFSN", atis = false },
]

[[position]]
match = ["LFSB_APP", "LFSB_*_APP"]
airports = [
  "LFSB",
  "LFGA",
  "LFGJ",
  { icao = "LFSD", atis = false },
  { icao = "LFQM", atis = false },
  { icao = "LFLH", atis = false },
  { icao = "LFSM", atis = false },
]

[[position]]
match = ["LFST_*_APP"]
airports = [
  "LFST",
  "LFJL",
  { icao = "LFSG", atis = false },
  { icao = "LFSN", atis = false },
]

[[position]]
match = ["LFEE_CTR", "LFEE_4EH_CTR", "LFEE_RME_CTR"]
airports = [
  "LFSB",
  "LFST",
  "LFJL",
  "LFGA",
  "LFGJ",
  { icao = "LFSD", atis = false },
  { icao = "LFSG", atis = false },
  { icao = "LFSN", atis = false },
  { icao = "LFQM", atis = false },
  { icao = "LFLH", atis = false },
  { icao = "LFSM", atis = false },
]