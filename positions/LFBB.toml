#:schema ../schemas/positions.schema.json
# Bordeaux FIR.
#
# Each entry lists the airports a position is responsible for, most important
# first. Only the first four that publish an ATIS can be on at once, so the
# order is the priority. An airport with `atis = false` keeps its runway
# configuration without an ATIS, for a field in the area that gets no top-down
# service. See the README for the full format.
#
# Tower, ground, delivery and ramp are not listed: they are responsible for the
# airport their callsign names, and need no entry.
#
# Every approach below covers its own field. Where it also gives top-down
# service to neighbouring fields, add them to its list.
#
# Centre positions are not described yet. Each needs an entry naming the
# airports it covers when no approach is open beneath it.

[[position]]
match = ["LFBD_*_APP"]
airports = [
  "LFBD",
  "LFBH",
  "LFBE",
  { icao = "LFBS", atis = false },
  { icao = "LFBX", atis = false },
  { icao = "LFCH", atis = false },
  { icao = "LFCY", atis = false },
  { icao = "LFDN", atis = false },
]

[[position]]
match = ["LFBH_APP", "LFBH_*_APP"]
airports = [
  "LFBH",
  { icao = "LFDN", atis = false },
]

[[position]]
match = ["LFBI_APP", "LFBI_*_APP"]
airports = [
  "LFBI",
  { icao = "LFBN", atis = false },
  { icao = "LFLX", atis = false },
]

[[position]]
match = ["LFBL_APP", "LFBL_*_APP"]
airports = [
  "LFBL",
  "LFBU",
  { icao = "LFBK", atis = false },
  { icao = "LFSL", atis = false },
]

[[position]]
match = ["LFBO_*_APP"]
airports = [
  "LFBO",
  "LFMK",
  "LFBA",
  { icao = "LFBF", atis = false },
  { icao = "LFBR", atis = false },
  { icao = "LFCC", atis = false },
  { icao = "LFCI", atis = false },
  { icao = "LFCK", atis = false },
  { icao = "LFCL", atis = false },
  { icao = "LFDJ", atis = false },
]
note = "Toulouse approach area. Every sector sets all these runways, since each sees their traffic. The ATIS go to Blagnac, Agen and Carcassonne."

[[position]]
match = ["LFBP_APP", "LFBP_*_APP"]
airports = [
  "LFBZ",
  "LFBP",
  "LFBT",
  { icao = "LFDH", atis = false },
  { icao = "LFBY", atis = false },
]

[[position]]
match = ["LFBZ_APP", "LFBZ_*_APP"]
airports = [
  "LFBZ",
  { icao = "LFBY", atis = false },
]

[[position]]
match = ["LFBB_CTR"]
airports = [
  "LFBO",
